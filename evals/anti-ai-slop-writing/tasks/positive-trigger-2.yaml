id: positive-trigger-002
name: Positive Trigger 2
description: >-
  Positive trigger: draft. Draft an internal note from fixture facts only.
tags:
  - positive-trigger
inputs:
  prompt: >-
    draft an internal note from facts-launch.md only. Keep it short.
    Do not invent metrics.
  files:
    - path: facts-launch.md
expected:
  should_trigger: true
graders:
  - type: trigger
    name: should-trigger
    config:
      skill_path: skills/anti-ai-slop-writing/SKILL.md
      mode: positive
  - type: text
    name: uses-fixture-facts
    config:
      contains:
        - "34"
        - "12"
